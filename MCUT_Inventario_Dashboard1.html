<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MCUT — Inventario</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');
:root {
  --bg:#0d0f12; --surface:#14171c; --surface2:#1c2028; --border:#2a2f3a;
  --accent:#00d4aa; --accent2:#0066ff; --warn:#f59e0b; --danger:#ef4444;
  --text:#e8eaf0; --text2:#8892a4; --text3:#4a5568;
  --mono:'DM Mono','Courier New',monospace; --sans:'Syne',system-ui,sans-serif; --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:28px 16px 80px;}

/* Header */
.hdr{margin-bottom:20px;}
.hdr-top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.logo-tag{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;}
.logo-title{font-size:26px;font-weight:800;font-family:var(--sans);}
.logo-title span{color:var(--accent);}
.stats{display:flex;gap:8px;flex-wrap:wrap;}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;text-align:center;}
.stat .v{font-family:var(--mono);font-size:16px;color:var(--accent);display:block;font-weight:500;}
.stat .l{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;}

/* Status */
.status{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;font-family:var(--mono);font-size:11px;color:var(--text3);transition:all .3s;}
.status.live{border-color:rgba(0,212,170,.3);}
.status.err{border-color:rgba(239,68,68,.3);color:var(--danger);}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sdot.pulse{background:var(--accent);animation:pulse 2s infinite;}
.sdot.warn{background:var(--warn);animation:pulse 1s infinite;}
.sdot.err{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* Search */
.sw{position:relative;margin-bottom:10px;}
.si-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:20px;pointer-events:none;}
#si{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px 16px 16px 48px;font-family:var(--mono);font-size:15px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;}
#si::placeholder{color:var(--text3);}
#si:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,.1);}
#si:disabled{opacity:.4;}
.hint{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:16px;padding-left:4px;}

/* Suggestions */
#sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);max-height:260px;overflow-y:auto;z-index:200;box-shadow:0 16px 48px rgba(0,0,0,.6);display:none;-webkit-overflow-scrolling:touch;}
#sugg::-webkit-scrollbar{width:3px;}
#sugg::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.sitem{padding:11px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);transition:background .15s;}
.sitem:last-child{border-bottom:none;}
.sitem:hover,.sitem.act{background:rgba(0,212,170,.08);}
.sr{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr em{color:var(--text);font-style:normal;background:rgba(0,212,170,.15);border-radius:2px;padding:0 2px;}
.sd{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.ss{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.ss.y{background:rgba(0,212,170,.15);color:var(--accent);}
.ss.n{background:rgba(239,68,68,.1);color:var(--danger);}

/* Result */
#res{display:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px;animation:slideUp .25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Card header */
.ch{background:linear-gradient(135deg,rgba(0,212,170,.08),rgba(0,102,255,.05));border-bottom:1px solid var(--border);padding:20px;}
.ch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.c-ref{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.c-ref::before{content:'';width:7px;height:7px;background:var(--accent);border-radius:50%;display:inline-block;}
.c-desc{font-size:18px;font-weight:700;color:var(--text);line-height:1.3;}
.c-marca{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 8px;text-transform:uppercase;}
.c-precio{text-align:right;flex-shrink:0;}
.pl{font-family:var(--mono);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.pv{font-family:var(--mono);font-size:22px;font-weight:500;}
.pv.sp{font-size:13px;color:var(--text3);}
.ps{font-size:10px;color:var(--text3);margin-top:2px;}

/* Stock grid — 3 bodegas + separador + 3 calculados */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);}
.sg2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-top:2px solid var(--accent2);}
@media(max-width:500px){.sg,.sg2{grid-template-columns:repeat(2,1fr);}}
.sc{background:var(--surface);padding:16px;}
.sc:hover{background:var(--surface2);}
.sc.highlight{background:rgba(0,212,170,.04);}
.sc.warn-cell{background:rgba(245,158,11,.03);}
.sc.danger-cell{background:rgba(239,68,68,.03);}
.sl{font-family:var(--mono);font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.b{background:var(--accent2);} .dot.s{background:var(--accent);} .dot.p{background:var(--warn);}
.dot.t{background:var(--text2);} .dot.c{background:var(--danger);} .dot.d{background:var(--accent);}
.dot.ps{background:var(--warn);}
.sv{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1;}
.sv.z{color:var(--text3);} .sv.h{color:var(--text);}
.sc.highlight .sv.h{color:var(--accent);font-size:32px;}
.sc.warn-cell .sv.h{color:var(--warn);}
.sc.danger-cell .sv{color:var(--danger);}
.su{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:3px;}
.pn{font-size:9px;color:var(--warn);margin-top:3px;font-family:var(--mono);}
.section-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;padding:6px 16px;background:var(--surface2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}

/* Footer */
.cf{border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.ba{display:flex;align-items:center;gap:8px;}
.bl{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;}
.bv{font-family:var(--mono);font-size:13px;color:var(--text2);}
.bv.m{color:var(--text3);font-style:italic;}
.ab{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:500;padding:6px 12px;border-radius:7px;}
.ab.av{background:rgba(0,212,170,.12);color:var(--accent);border:1px solid rgba(0,212,170,.3);}
.ab.un{background:rgba(239,68,68,.08);color:var(--danger);border:1px solid rgba(239,68,68,.2);}

/* Empty / initial */
#empty{text-align:center;padding:60px 20px;display:none;}
#init{text-align:center;padding:48px 20px;}
.bi{font-size:44px;margin-bottom:14px;opacity:.12;}
.bt{font-family:var(--mono);font-size:12px;color:var(--text3);line-height:1.9;}
.bt strong{color:var(--text2);}
</style>
</head>

let INV = [];
let aidx = -1, suggs = [];

const inp = document.getElementById('si');
const sbox = document.getElementById('sugg');
const res = document.getElementById('res');
const empty = document.getElementById('empty');
const init = document.getElementById('init');

function setStatus(type, msg) {
  document.getElementById('sb').className = 'status ' + type;
  document.getElementById('sdot').className = 'sdot ' + (type==='live'?'pulse':type==='err'?'err':'warn');
  document.getElementById('stxt').textContent = msg;
}

function fmt(p) {
  if (!p || p===0) return null;
  return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0}).format(p);
}

function hl(text, q) {
  if (!q||!text) return text||'';
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i===-1) return text;
  return text.slice(0,i)+'<em>'+text.slice(i,i+q.length)+'</em>'+text.slice(i+q.length);
}

function showRes(item) {
  init.style.display='none'; empty.style.display='none'; sbox.style.display='none';
  const precio = fmt(item.precio);
  const avail = item.disp > 0;
  const bc = item.barcode && item.barcode!=='' && item.barcode!=='nan' && item.barcode!=='SIN EXISTENCIA';

  res.innerHTML = `<div class="card">
    <div class="ch">
      <div class="ch-top">
        <div>
          <div class="c-ref">${item.ref}</div>
          <div class="c-desc">${item.desc||'—'}</div>
          ${item.marca?`<span class="c-marca">${item.marca}</span>`:''}
        </div>
        <div class="c-precio">
          <div class="pl">Precio de venta</div>
          ${precio
            ?`<div class="pv">${precio}</div><div class="ps">+ IVA según aplique</div>`
            :`<div class="pv sp">Sin precio registrado</div><div class="ps">Consultar lista de precios</div>`}
        </div>
      </div>
    </div>

    <div class="section-label">Existencia en SIESA por bodega</div>
    <div class="sg">
      <div class="sc">
        <div class="sl"><span class="dot b"></span>Bogotá (001)</div>
        <div class="sv ${item.bog>0?'h':'z'}">${item.bog}</div>
        <div class="su">unidades</div>
      </div>
      <div class="sc">
        <div class="sl"><span class="dot s"></span>Sabaneta (002)</div>
        <div class="sv ${item.sab>0?'h':'z'}">${item.sab}</div>
        <div class="su">unidades</div>
      </div>
      <div class="sc">
        <div class="sl"><span class="dot p"></span>En Pruebas (003)</div>
        <div class="sv ${item.pruebas>0?'h':'z'}">${item.pruebas}</div>
        <div class="su">unidades</div>
        ${item.pruebas>0?'<div class="pn">⚠ No disponible para venta</div>':''}
      </div>
    </div>

    <div class="section-label">Resumen de disponibilidad</div>
    <div class="sg2">
      <div class="sc ${item.comp>0?'danger-cell':''}">
        <div class="sl"><span class="dot c"></span>Comprometido</div>
        <div class="sv ${item.comp>0?'h':'z'}">${item.comp}</div>
        <div class="su">pendiente factura</div>
      </div>
      <div class="sc ${item.porsubir>0?'warn-cell':''}">
        <div class="sl"><span class="dot ps"></span>Por Subir a SIESA</div>
        <div class="sv ${item.porsubir>0?'h':'z'}">${item.porsubir}</div>
        <div class="su">en bodega, sin subir</div>
      </div>
      <div class="sc highlight">
        <div class="sl"><span class="dot d"></span>Disponible Real</div>
        <div class="sv ${item.disp>0?'h':'z'}">${item.disp}</div>
        <div class="su">para confirmar venta</div>
      </div>
    </div>

    <div class="cf">
      <div class="ba">
        <span class="bl">Cód. barras</span>
        <span class="bv ${bc?'':'m'}">${bc?item.barcode:'No registrado'}</span>
      </div>
      <div class="ab ${avail?'av':'un'}">${avail?'✓ Disponible para venta':'✗ Sin stock disponible'}</div>
    </div>
  </div>`;
  res.style.display='block';
}

function showEmpty(q) {
  init.style.display='none'; res.style.display='none'; sbox.style.display='none';
  document.getElementById('nfr').textContent='"'+q+'"';
  empty.style.display='block';
}

function renderSugg(q) {
  if (!q||q.length<2){sbox.style.display='none';suggs=[];aidx=-1;return;}
  const ql=q.toLowerCase();
  suggs=INV.filter(d=>d.ref.toLowerCase().includes(ql)||d.desc.toLowerCase().includes(ql)||d.marca.toLowerCase().includes(ql)).slice(0,10);
  if (!suggs.length){sbox.style.display='none';return;}
  sbox.innerHTML=suggs.map((it,i)=>`
    <div class="sitem" data-i="${i}">
      <span class="sr">${hl(it.ref,q)}</span>
      <span class="sd">${(it.desc||'').substring(0,38)}${(it.desc||'').length>38?'…':''}</span>
      <span class="ss ${it.disp>0?'y':'n'}">${it.disp>0?it.disp+' uds':'Sin stock'}</span>
    </div>`).join('');
  sbox.querySelectorAll('.sitem').forEach(el=>{
    el.addEventListener('click',()=>sel(suggs[+el.dataset.i]));
    el.addEventListener('touchend',e=>{e.preventDefault();sel(suggs[+el.dataset.i]);});
  });
  sbox.style.display='block'; aidx=-1;
}

function sel(item){inp.value=item.ref;sbox.style.display='none';aidx=-1;showRes(item);inp.blur();}

function setAct(i){
  sbox.querySelectorAll('.sitem').forEach(el=>el.classList.remove('act'));
  if(i>=0&&i<suggs.length){sbox.querySelectorAll('.sitem')[i].classList.add('act');sbox.querySelectorAll('.sitem')[i].scrollIntoView({block:'nearest'});}
  aidx=i;
}

inp.addEventListener('input',()=>{
  renderSugg(inp.value.trim());
  if(inp.value.trim().length<2){res.style.display='none';empty.style.display='none';init.style.display='block';}
});

inp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();setAct(Math.min(aidx+1,suggs.length-1));}
  else if(e.key==='ArrowUp'){e.preventDefault();setAct(Math.max(aidx-1,0));}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(aidx>=0&&suggs[aidx])sel(suggs[aidx]);
    else{const q=inp.value.trim();const ex=INV.find(d=>d.ref.toLowerCase()===q.toLowerCase());if(ex)showRes(ex);else if(q.length>0)showEmpty(q);}
  }else if(e.key==='Escape'){sbox.style.display='none';inp.value='';res.style.display='none';empty.style.display='none';init.style.display='block';aidx=-1;}
});

document.addEventListener('click',e=>{if(!e.target.closest('.sw'))sbox.style.display='none';});
document.addEventListener('touchstart',e=>{if(!e.target.closest('.sw'))sbox.style.display='none';},{passive:true});

function initUI(){
  document.getElementById('tRef').textContent=INV.length.toLocaleString('es-CO');
  document.getElementById('tStk').textContent=INV.filter(d=>d.disp>0).length.toLocaleString('es-CO');
  inp.disabled=false;
  inp.placeholder='Referencia, descripción o marca...';
}

async function boot() {
  INV = FALLBACK;
  initUI();
  document.getElementById('tUpd').textContent = '02/06';
  setStatus('', 'Conectando con OneDrive...');

  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch('https://mcutsas.sharepoint.com/:u:/s/MCUTSAS/IQCawDOCNRZ3TpmAAUX-ry_sAaha6UjIcGJBojnfcPJwguQ?e=ErYg5f&download=1', {
      signal: ctrl.signal,
      credentials: 'include',
      headers: {'Accept': 'application/json, text/plain, */*'}
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { throw new Error('JSON invalido'); }
    
    if (!Array.isArray(data) || data.length === 0) throw new Error('Sin datos');
    
    INV = data.map(row => ({
      ref: String(row.Referencia || row.ref || ''),
      desc: String(row.Descripcion || row.desc || ''),
      marca: String(row.Marca || row.marca || '').toUpperCase(),
      bog: Number(row.Bogota_001 || row.bog || 0),
      sab: Number(row.Sabaneta_002 || row.sab || 0),
      pruebas: Number(row.EnPruebas_003 || row.pruebas || 0),
      total: Number(row.Total_SIESA || row.total || 0),
      comp: Number(row.Comprometido || row.comp || 0),
      disp: Number(row.Disponible_Real || row.disp || 0),
      porsubir: Number(row.Por_Subir_SIESA || row.porsubir || 0),
      precio: (FALLBACK.find(d => d.ref === String(row.Referencia || row.ref || '')) || {}).precio || 0,
      barcode: (FALLBACK.find(d => d.ref === String(row.Referencia || row.ref || '')) || {}).barcode || ''
    })).filter(r => r.ref && r.ref !== 'undefined');
    
    initUI();
    const t = new Date().toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('tUpd').textContent = t;
    setStatus('live', '● En vivo desde OneDrive · Hoy ' + t);
    
  } catch(e) {
    setStatus('err', '⚠ Sin conexión OneDrive — datos del 02/06/2026');
    console.warn('JSON fetch failed:', e.message);
  }
}
boot();
</script>
